{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5">
                <div class="display-1 text-danger fw-bold mb-3">{{ code }}</div>
                <h3 class="fw-bold mb-2">{{ title }}</h3>
                <p class="text-secondary mb-4">{{ message }}</p>
                <div>
                    <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
